[build-system]
requires = ["setuptools>=77", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlabelops"
version = "0.1.1"
description = "Fast CPU operations for integer instance masks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.0"]

[project.urls]
Repository = "https://github.com/ajinkya-kulkarni/fastlabelops"
Issues = "https://github.com/ajinkya-kulkarni/fastlabelops/issues"

[dependency-groups]
dev = [
    "build>=1.2",
    "fastremap>=1.15",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "setuptools>=84.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
